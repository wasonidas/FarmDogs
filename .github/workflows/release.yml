name: Build and release FarmDogs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmdogs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          architecture: x64
      - name: Read the version
        id: version
        run: |
          $releaseVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'package.json must contain a numeric major.minor.patch version.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=v$releaseVersion"
      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Drafts are not reliably visible through /releases/tags/{tag}.
          # This exact interrupted release is handled only by its pinned recovery.
          if ($env:GH_REPO -ceq 'wasonidas/FarmDogs' -and $env:RELEASE_TAG -ceq 'v0.5.4') {
            $recoveryErrors = Join-Path $env:RUNNER_TEMP 'farmdogs-054-recovery-view.err'
            $recoveryJson = & gh api "repos/$env:GH_REPO/releases/430768060" 2> $recoveryErrors
            if ($LASTEXITCODE -eq 0) {
              $recovery = $recoveryJson | ConvertFrom-Json
              if ($recovery.id -ne 430768060 -or $recovery.tag_name -cne 'v0.5.4' -or $recovery.target_commitish -cne 'dbc1243d6b280fbf94462b5607ab87829b4d7a4d' -or $recovery.prerelease -ne $false) { throw 'The pinned recovery release identity changed.' }
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish=false'
              if ($recovery.draft) { Write-Output '::notice::The verified 0.5.4 draft is reserved for recover-0.5.4.yml; no duplicate build or release will be created.' }
              else { Write-Output 'The recovered 0.5.4 release is already published; it will remain unchanged.' }
              exit 0
            }
            $recoveryStatus = (& gh api --include "repos/$env:GH_REPO/releases/430768060" 2> $recoveryErrors) -join "`n"
            if ($recoveryStatus -notmatch '(?m)^HTTP/\S+\s+404(?:\s|$)') { throw 'Could not verify the pinned recovery state.' }
          }
          $inventoryComplete = $false
          for ($page = 1; $page -le 100; $page++) {
            $inventoryJson = & gh api "repos/$env:GH_REPO/releases?per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the authenticated release inventory.' }
            $rows = @($inventoryJson | ConvertFrom-Json)
            $matches = @($rows | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
            if ($matches.Count -gt 1) { throw 'The version has multiple release identities.' }
            if ($matches.Count -eq 1) {
              if ($matches[0].draft) { throw 'This version has an incomplete draft. Review that numeric release ID before publishing again.' }
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish=false'
              Write-Output 'The published version is unchanged. Increase package.json version to publish a new portable.'
              exit 0
            }
            if ($rows.Count -lt 100) { $inventoryComplete = $true; break }
          }
          if (!$inventoryComplete) { throw 'Could not exhaust the release inventory safely.' }
          $tagErrors = Join-Path $env:RUNNER_TEMP 'farmdogs-release-tag.err'
          $tagResponse = (& gh api --include "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" 2> $tagErrors) -join "`n"
          if ($LASTEXITCODE -eq 0) { throw 'This version tag already exists without a published release. Review it before publishing.' }
          if ($tagResponse -notmatch '(?m)^HTTP/\S+\s+404(?:\s|$)') { throw 'Could not verify that the version tag is absent. No release will be created.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish=true'
          exit 0
      - name: Check the Windows build requirements
        run: |
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $metadata = Join-Path $env:WINDIR 'System32\WinMetadata'
          $runtimeFacade = Join-Path $env:WINDIR 'Microsoft.NET\assembly\GAC_MSIL\System.Runtime\v4.0_4.0.0.0__b03f5f7f11d50a3a\System.Runtime.dll'
          foreach ($requiredFile in @((Join-Path $framework 'csc.exe'), (Join-Path $framework 'System.Runtime.WindowsRuntime.dll'), $runtimeFacade)) {
            if (!(Test-Path -LiteralPath $requiredFile -PathType Leaf)) { throw "Missing Windows build dependency: $requiredFile" }
          }
          if (!(Test-Path -LiteralPath $metadata -PathType Container) -or !(Get-ChildItem -LiteralPath $metadata -Filter '*.winmd')) { throw 'The Windows WinRT metadata directory is unavailable.' }
          $nodeLicense = Join-Path (Split-Path (Get-Command node).Source) 'LICENSE'
          if (!(Test-Path -LiteralPath $nodeLicense -PathType Leaf)) { throw 'The official Node distribution LICENSE is required to bundle Node.' }
          if (!(Test-Path -LiteralPath LICENSE -PathType Leaf)) { throw 'The FarmDogs source license is missing.' }
          Get-Command tar.exe | Out-Null
      - name: Test without game input
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'The test suite failed.' }
      - name: Build the Windows components and portable
        if: steps.release.outputs.publish == 'true'
        run: |
          foreach ($buildScript in @('build:movement', 'build:reader', 'build:team-clicker', 'build:entry', 'build:updater', 'build:desktop', 'build:launcher', 'package:portable')) {
            npm run $buildScript
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $buildScript" }
          }
      - name: Verify the bundled runtime and prepare the release files
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $portableInfo = Get-Content -LiteralPath dist/latest-portable.json -Raw | ConvertFrom-Json
          $probeReport = Join-Path $env:RUNNER_TEMP 'farmdogs-portable-probe.json'
          $probe = [System.Diagnostics.Process]::new()
          $probe.StartInfo.FileName = Join-Path $portableInfo.folder 'FarmDogs.exe'
          $probe.StartInfo.WorkingDirectory = $portableInfo.folder
          $probe.StartInfo.UseShellExecute = $false
          $probe.StartInfo.CreateNoWindow = $true
          $probe.StartInfo.Environment['PATH'] = ''
          $probe.StartInfo.Environment['NODE_OPTIONS'] = ''
          $probe.StartInfo.ArgumentList.Add('--probe')
          $probe.StartInfo.ArgumentList.Add($probeReport)
          $probe.Start() | Out-Null
          if (!$probe.WaitForExit(15000)) { $probe.Kill(); throw 'The portable probe timed out.' }
          if ($probe.ExitCode -ne 0) { throw 'The portable probe failed.' }
          $probeResult = Get-Content -LiteralPath $probeReport -Raw | ConvertFrom-Json
          if (!$probeResult.success -or !$probeResult.bundledRuntime -or $probeResult.windowShown) { throw 'The portable did not pass its isolated-runtime probe.' }
          if (Test-Path -LiteralPath (Join-Path $portableInfo.folder 'data')) { throw 'The probe unexpectedly created private data.' }
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $releaseArchive = Join-Path $releaseDirectory 'FarmDogs-portable.zip'
          Copy-Item -LiteralPath $portableInfo.archive -Destination $releaseArchive
          $archiveHash = (Get-FileHash -LiteralPath $releaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $portableInfo.sha256) { throw 'The archive checksum changed.' }
          Set-Content -LiteralPath (Join-Path $releaseDirectory 'SHA256SUMS.txt') -Encoding ascii -Value "$archiveHash  FarmDogs-portable.zip"
          $releaseNotes = @(
            "# FarmDogs Launcher $env:RELEASE_TAG",
            '',
            '**Descarga FarmDogs-portable.zip**, extrae la carpeta completa y abre **FarmDogs.exe**. No necesitas instalar Node ni saber usar GitHub.',
            '',
            '## Novedades',
            '',
            '- Nuevo **Sedeo máximo**: aprovecha servidores vacíos o con poca gente para sumar tiempo de sedeo mientras espera un llenado.',
            '- Prioriza el servidor elegible con más jugadores por debajo del umbral oficial y confirma dos lecturas recientes antes de entrar.',
            '- **12 horas iniciales, ajustables**, con hora de fin visible. La duración incluye búsqueda, entrada y permanencia.',
            '- Movimiento después del despliegue verificado, incluso estando solo, sin esperar 20 jugadores. Conserva intervalo y duración del paso.',
            '- Mantiene el servidor elegido para conservar el ciclo; no rota a otros servidores ni lee llamadas de Discord.',
            '- Conserva entrada por ID, equipo automático y anti-AFK opcional de 0.5.4.',
            '- **Actualizaciones automáticas**: deja marcada la opción en la tarjeta Actualizaciones. Espera a que la app esté inactiva y conserva tus ajustes y cuenta.',
            '',
            'Para empezar: en **SEEDING**, elige **Sedeo máximo**, ajusta la duración y pulsa **Iniciar sedeo máximo**. Se recomienda equipo Aleatorio para entrar antes. Deja Wardogs delante y las manos vacías para el movimiento; **F8** o **Detener** cancelan.',
            '',
            'Incluye el runtime Node. Steam/Wardogs y Microsoft Edge WebView2 deben estar instalados.',
            'Si tienes una versión antigua sin actualizador, descarga una vez el ZIP y sustituye sus archivos con FarmDogs cerrado, conservando tu carpeta **data**. No compartas esa carpeta.',
            'Steam y Wardogs pueden empezar cerrados si Steam recuerda una sesión válida. Si pide contraseña o Steam Guard, debes completarlo tú.',
            '',
            'Los puntos mensuales por tiempo de sedeo no son días VIP inmediatos. El premio por llenado requiere cumplir la regla oficial y se comprueba en el historial. El nuevo modo tiene pruebas automáticas; la prueba nocturna real sigue pendiente, al igual que recuperación tras reinicio y esperas muy largas. No garantiza evitar cualquier expulsión ni obtener VIP.',
            '',
            'La guía completa de anti-AFK, seeding, clan, equipo y cuenta está en el README.',
            'SHA256SUMS.txt permite comprobar la descarga. El paquete no contiene cuentas, cookies ni registros locales.'
          )
          Set-Content -LiteralPath (Join-Path $releaseDirectory 'RELEASE_NOTES.md') -Encoding utf8 -Value $releaseNotes
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: farmdogs-release
          path: |
            release-artifacts/FarmDogs-portable.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: farmdogs-release
          path: release-artifacts
      - name: Publish the verified portable
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tempfile

          repo, tag, sha = os.environ['GH_REPO'], os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo), 'Invalid repository'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag) and re.fullmatch(r'[0-9a-f]{40}', sha), 'Invalid release identity'

          def api(method, endpoint, payload=None):
              command = ['gh', 'api', '--method', method, endpoint]
              data = None
              if payload is not None:
                  command += ['--input', '-']
                  data = json.dumps(payload)
              result = subprocess.run(command, input=data, capture_output=True, text=True, check=True)
              return json.loads(result.stdout)

          def optional_get(endpoint):
              result = subprocess.run(['gh', 'api', '--include', endpoint], capture_output=True, text=True)
              status = re.match(r'^HTTP/\S+\s+(\d{3})(?:\s|$)', result.stdout)
              assert status, 'Could not verify the HTTP response'
              if int(status.group(1)) == 404:
                  assert result.returncode != 0, 'Unexpected successful absence response'
                  return None
              assert int(status.group(1)) == 200 and result.returncode == 0, 'Could not verify the resource'
              _, separator, body = result.stdout.partition('\n\n')
              assert separator, 'Missing API response body'
              return json.loads(body)

          def verify_tag(allow_absent=False):
              reference = optional_get(f'repos/{repo}/git/ref/tags/{tag}')
              if reference is None:
                  assert allow_absent, 'The published source tag is absent'
                  return
              target = reference.get('object', {})
              assert target.get('type') == 'commit' and target.get('sha') == sha, 'The tag targets another source commit'

          def own_release(value, release_id, draft):
              assert type(value.get('id')) is int and value['id'] == release_id, 'Release identity changed'
              assert value.get('tag_name') == tag and value.get('target_commitish') == sha, 'Release source changed'
              assert value.get('draft') is draft and value.get('prerelease') is False, 'Unexpected stable release state'

          names = {'FarmDogs-portable.zip', 'SHA256SUMS.txt', 'RELEASE_NOTES.md'}
          assert {p.name for p in pathlib.Path('.').iterdir()} == names, 'Unexpected build artifact files'
          assert all(pathlib.Path(n).is_file() and not pathlib.Path(n).is_symlink() for n in names), 'Unsafe build artifact'
          archive, checksums = pathlib.Path('FarmDogs-portable.zip'), pathlib.Path('SHA256SUMS.txt')
          expected_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksums.read_text(encoding='ascii').splitlines() == [expected_hash + '  FarmDogs-portable.zip'], 'Build checksum mismatch'
          expected_assets = {p.name: {'size': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in (archive, checksums)}
          for page in range(1, 101):
              releases = api('GET', f'repos/{repo}/releases?per_page=100&page={page}')
              assert isinstance(releases, list) and all(isinstance(v, dict) for v in releases), 'Invalid release inventory'
              assert not any(v.get('tag_name') == tag for v in releases), 'Existing release/draft will not be overwritten'
              if len(releases) < 100:
                  break
          else:
              raise RuntimeError('Could not exhaust the release inventory')
          verify_tag(allow_absent=True)

          # Capture the numeric ID directly from CREATE. Draft lookup by tag is not used.
          created = api('POST', f'repos/{repo}/releases', {
              'tag_name': tag, 'target_commitish': sha, 'name': 'FarmDogs ' + tag,
              'body': pathlib.Path('RELEASE_NOTES.md').read_text(encoding='utf-8-sig'),
              'draft': True, 'prerelease': False, 'make_latest': 'false'
          })
          release_id = created.get('id')
          assert type(release_id) is int and release_id > 0, 'Missing CREATE release ID'
          own_release(created, release_id, True)
          endpoint = f'repos/{repo}/releases/{release_id}'
          for item in (archive, checksums):
              upload = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={item.name}'
              content_type = 'application/zip' if item.suffix == '.zip' else 'text/plain'
              result = subprocess.run(['gh', 'api', '--method', 'POST', '-H', 'Content-Type: ' + content_type,
                                       '--input', str(item), upload], capture_output=True, text=True, check=True)
              asset = json.loads(result.stdout)
              assert asset.get('name') == item.name and asset.get('state') == 'uploaded', 'Asset upload failed'

          def verify_assets(value, draft):
              own_release(value, release_id, draft)
              assets = value.get('assets', [])
              assert len(assets) == 2 and {v.get('name') for v in assets} == set(expected_assets), 'Unexpected release assets'
              with tempfile.TemporaryDirectory(prefix='farmdogs-release-verify-') as directory:
                  for asset in assets:
                      expected = expected_assets[asset['name']]
                      assert asset.get('state') == 'uploaded' and asset.get('size') == expected['size'], 'Asset metadata mismatch'
                      asset_id = asset.get('id')
                      assert type(asset_id) is int and asset_id > 0, 'Invalid asset ID'
                      downloaded = pathlib.Path(directory) / asset['name']
                      with downloaded.open('wb') as output:
                          subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                                          f'repos/{repo}/releases/assets/{asset_id}'], stdout=output, check=True)
                      assert hashlib.sha256(downloaded.read_bytes()).hexdigest() == expected['sha256'], 'Downloaded asset checksum mismatch'

          verify_assets(api('GET', endpoint), True)
          verify_tag(allow_absent=True)
          published = api('PATCH', endpoint, {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          own_release(published, release_id, False)
          assert published.get('published_at'), 'Release was not published'
          verify_tag()
          verify_assets(api('GET', endpoint), False)
          latest = api('GET', f'repos/{repo}/releases/latest')
          own_release(latest, release_id, False)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### FarmDogs publicado\n\n{published['html_url']}\n\n")
              summary.write(f'Source `{sha}`; numeric release `{release_id}`; both assets downloaded and SHA256-verified.\n')
          PY
