name: Build and release FarmDogs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmdogs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          architecture: x64
      - name: Read the version
        id: version
        run: |
          $releaseVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'package.json must contain a numeric major.minor.patch version.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=v$releaseVersion"
      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $viewErrors = Join-Path $env:RUNNER_TEMP 'farmdogs-release-view.err'
          $releaseJson = & gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json tagName,isDraft 2> $viewErrors
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $releaseJson | ConvertFrom-Json
            if ($existingRelease.isDraft) { throw 'This version has an incomplete draft release. Review the draft before publishing again.' }
            if ($existingRelease.tagName -ne $env:RELEASE_TAG) { throw 'GitHub returned an unexpected release.' }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish=false'
            Write-Output 'The published version is unchanged. Increase package.json version to publish a new portable.'
            exit 0
          }
          # A failed release view can also mean authentication/network failure.
          # Only a confirmed HTTP 404 authorizes creating a new release.
          $apiErrors = Join-Path $env:RUNNER_TEMP 'farmdogs-release-api.err'
          $apiResponse = (& gh api --include "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" 2> $apiErrors) -join "`n"
          if ($LASTEXITCODE -eq 0) { throw 'The release appeared during the check. Run again to inspect it without modifying it.' }
          if ($apiResponse -notmatch '(?m)^HTTP/\S+\s+404(?:\s|$)') { throw 'Could not verify that the release is absent. No release will be created.' }
          $tagErrors = Join-Path $env:RUNNER_TEMP 'farmdogs-release-tag.err'
          $tagResponse = (& gh api --include "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" 2> $tagErrors) -join "`n"
          if ($LASTEXITCODE -eq 0) { throw 'This version tag already exists without a published release. Review it before publishing.' }
          if ($tagResponse -notmatch '(?m)^HTTP/\S+\s+404(?:\s|$)') { throw 'Could not verify that the version tag is absent. No release will be created.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'publish=true'
          exit 0
      - name: Check the Windows build requirements
        run: |
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $metadata = Join-Path $env:WINDIR 'System32\WinMetadata'
          $runtimeFacade = Join-Path $env:WINDIR 'Microsoft.NET\assembly\GAC_MSIL\System.Runtime\v4.0_4.0.0.0__b03f5f7f11d50a3a\System.Runtime.dll'
          foreach ($requiredFile in @((Join-Path $framework 'csc.exe'), (Join-Path $framework 'System.Runtime.WindowsRuntime.dll'), $runtimeFacade)) {
            if (!(Test-Path -LiteralPath $requiredFile -PathType Leaf)) { throw "Missing Windows build dependency: $requiredFile" }
          }
          if (!(Test-Path -LiteralPath $metadata -PathType Container) -or !(Get-ChildItem -LiteralPath $metadata -Filter '*.winmd')) { throw 'The Windows WinRT metadata directory is unavailable.' }
          $nodeLicense = Join-Path (Split-Path (Get-Command node).Source) 'LICENSE'
          if (!(Test-Path -LiteralPath $nodeLicense -PathType Leaf)) { throw 'The official Node distribution LICENSE is required to bundle Node.' }
          if (!(Test-Path -LiteralPath LICENSE -PathType Leaf)) { throw 'The FarmDogs source license is missing.' }
          Get-Command tar.exe | Out-Null
      - name: Test without game input
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'The test suite failed.' }
      - name: Build the Windows components and portable
        if: steps.release.outputs.publish == 'true'
        run: |
          foreach ($buildScript in @('build:movement', 'build:reader', 'build:team-clicker', 'build:entry', 'build:updater', 'build:desktop', 'build:launcher', 'package:portable')) {
            npm run $buildScript
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $buildScript" }
          }
      - name: Verify the bundled runtime and prepare the release files
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $portableInfo = Get-Content -LiteralPath dist/latest-portable.json -Raw | ConvertFrom-Json
          $probeReport = Join-Path $env:RUNNER_TEMP 'farmdogs-portable-probe.json'
          $probe = [System.Diagnostics.Process]::new()
          $probe.StartInfo.FileName = Join-Path $portableInfo.folder 'FarmDogs.exe'
          $probe.StartInfo.WorkingDirectory = $portableInfo.folder
          $probe.StartInfo.UseShellExecute = $false
          $probe.StartInfo.CreateNoWindow = $true
          $probe.StartInfo.Environment['PATH'] = ''
          $probe.StartInfo.Environment['NODE_OPTIONS'] = ''
          $probe.StartInfo.ArgumentList.Add('--probe')
          $probe.StartInfo.ArgumentList.Add($probeReport)
          $probe.Start() | Out-Null
          if (!$probe.WaitForExit(15000)) { $probe.Kill(); throw 'The portable probe timed out.' }
          if ($probe.ExitCode -ne 0) { throw 'The portable probe failed.' }
          $probeResult = Get-Content -LiteralPath $probeReport -Raw | ConvertFrom-Json
          if (!$probeResult.success -or !$probeResult.bundledRuntime -or $probeResult.windowShown) { throw 'The portable did not pass its isolated-runtime probe.' }
          if (Test-Path -LiteralPath (Join-Path $portableInfo.folder 'data')) { throw 'The probe unexpectedly created private data.' }
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $releaseArchive = Join-Path $releaseDirectory 'FarmDogs-portable.zip'
          Copy-Item -LiteralPath $portableInfo.archive -Destination $releaseArchive
          $archiveHash = (Get-FileHash -LiteralPath $releaseArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $portableInfo.sha256) { throw 'The archive checksum changed.' }
          Set-Content -LiteralPath (Join-Path $releaseDirectory 'SHA256SUMS.txt') -Encoding ascii -Value "$archiveHash  FarmDogs-portable.zip"
          $releaseNotes = @(
            "# FarmDogs Launcher $env:RELEASE_TAG",
            '',
            '**Descarga FarmDogs-portable.zip**, extrae la carpeta completa y abre **FarmDogs.exe**. No necesitas instalar Node ni saber usar GitHub.',
            '',
            '## Novedades',
            '',
            '- Elige servidor y equipo: FarmDogs completa la entrada y espera tu color hasta DESPLEGANDO.',
            '- Nueva casilla **Activar anti-AFK al desplegar**. Usa tus ajustes y empieza a contar al entrar, sin consumir la cola.',
            '- Ventana fija más compacta, barra oscura e icono propio.',
            '- Si cambias de ventana, el selector automático pausa y vuelve a reconocer la pantalla al regresar al juego.',
            '- Mejor lectura del personaje desplegado y mensajes más precisos de controladores y permisos.',
            '- **Actualizaciones automáticas**: deja marcada la opción en la tarjeta Actualizaciones. Espera a que la app esté inactiva y conserva tus ajustes y cuenta.',
            '',
            'Para empezar: en **JUGAR**, elige servidor y equipo, marca anti-AFK si lo quieres y pulsa **Entrar automáticamente**. Deja Wardogs delante y las manos vacías para el movimiento; **F8** o **Detener** cancelan.',
            '',
            'Incluye el runtime Node. Steam/Wardogs y Microsoft Edge WebView2 deben estar instalados.',
            'Si tienes una versión antigua sin actualizador, descarga una vez el ZIP y sustituye sus archivos con FarmDogs cerrado, conservando tu carpeta **data**. No compartas esa carpeta.',
            'Steam y Wardogs pueden empezar cerrados si Steam recuerda una sesión válida. Si pide contraseña o Steam Guard, debes completarlo tú.',
            '',
            'El usuario confirmó entrada, equipo, despliegue y anti-AFK opcional. La versión base pasó 579 pruebas automáticas. Quedan pendientes pruebas reales completas de recuperación tras reinicio, entrada por actividad y esperas muy largas. No garantiza evitar cualquier expulsión ni obtener VIP.',
            '',
            'La guía completa de anti-AFK, seeding, clan, equipo y cuenta está en el README.',
            'SHA256SUMS.txt permite comprobar la descarga. El paquete no contiene cuentas, cookies ni registros locales.'
          )
          Set-Content -LiteralPath (Join-Path $releaseDirectory 'RELEASE_NOTES.md') -Encoding utf8 -Value $releaseNotes
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: farmdogs-release
          path: |
            release-artifacts/FarmDogs-portable.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: farmdogs-release
          path: release-artifacts
      - name: Publish the verified portable
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" FarmDogs-portable.zip SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --draft \
            --title "FarmDogs $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          created_release_id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.id')
          [[ "$created_release_id" =~ ^[1-9][0-9]*$ ]]
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets,isDraft \
            --jq 'if .isDraft and ([.assets[].name] | index("FarmDogs-portable.zip") != null and index("SHA256SUMS.txt") != null) then "Release assets verified" else error("Incomplete draft assets") end'
          verification_directory=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$verification_directory" \
            --pattern FarmDogs-portable.zip --pattern SHA256SUMS.txt
          cmp SHA256SUMS.txt "$verification_directory/SHA256SUMS.txt"
          cmp FarmDogs-portable.zip "$verification_directory/FarmDogs-portable.zip"
          (cd "$verification_directory" && sha256sum --check SHA256SUMS.txt)
          CREATED_RELEASE_ID="$created_release_id" python3 - <<'PY'
          import json, os, re, subprocess

          repo, tag, sha = os.environ['GH_REPO'], os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA']
          release_id = int(os.environ['CREATED_RELEASE_ID'])
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'A full source commit SHA is required'

          def get(route):
              result = subprocess.run(['gh', 'api', route], capture_output=True, text=True, check=True)
              return json.loads(result.stdout)

          draft = get(f'repos/{repo}/releases/{release_id}')
          assert draft.get('id') == release_id and draft.get('draft') is True, 'The created draft identity changed'
          assert draft.get('tag_name') == tag and draft.get('target_commitish') == sha, 'The draft does not target this source commit'
          assert get(f'repos/{repo}/releases/tags/{tag}').get('id') == release_id, 'The tag now names another release'

          response = subprocess.run(['gh', 'api', '--include', f'repos/{repo}/git/ref/tags/{tag}'], capture_output=True, text=True)
          status = re.match(r'^HTTP/\S+\s+(\d{3})(?:\s|$)', response.stdout)
          assert status, 'Could not confirm the tag HTTP status before publishing'
          code = int(status.group(1))
          if code == 404:
              assert response.returncode != 0, 'Unexpected successful response for an absent tag'
          else:
              assert code == 200 and response.returncode == 0, 'Could not verify the tag before publishing'
              headers, separator, body = response.stdout.partition('\n\n')
              assert separator, 'Missing tag response body'
              target = json.loads(body).get('object', {})
              assert target.get('type') == 'commit' and target.get('sha') == sha, 'The tag points to another source commit'
          PY
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
          published_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$published_sha" = "$GITHUB_SHA"
          release_url=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq .url)
          printf '### FarmDogs publicado\n\n%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
